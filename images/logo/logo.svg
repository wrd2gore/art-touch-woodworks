<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E2F"/>
      <stop offset="100%" stop-color="#550E1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C287"/>
      <stop offset="100%" stop-color="#A87A38"/>
    </linearGradient>
  </defs>
  <!-- Emblem (Stylized Geometric Wood Joinery & Architectural Frame) -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="url(#burgundyGrad)"/>
    <!-- Interlocking Japanese Joinery / Timber Motif -->
    <path d="M24 8 L38 18 L38 30 L24 40 L10 30 L10 18 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M24 8 L24 40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 18 L38 30" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M10 30 L38 18" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3.5" fill="#E5C287"/>
  </g>
  <!-- Brand Typography -->
  <text x="66" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#14171A">ART<tspan fill="#6B1724"> TOUCH</tspan></text>
  <text x="67" y="47" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#727B86">WOODWORKS &amp; INTERIORS</text>
</svg>
